<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE1">
<title>Мои заказы — Питомник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3EEE1;--cream-2:#EBE4D1;--ink:#0B3B17;--ink-60:rgba(11,59,23,.6);
  --ink-40:rgba(11,59,23,.4);--coral:#E14B63;--coral-deep:#BC2F47;
  --line:rgba(11,59,23,.16);--serif:'Cormorant',Georgia,serif;
  --sans:'Manrope',-apple-system,'Segoe UI',sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--cream);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.head{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + var(--sat)) 20px 14px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px}
.back{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40)}
.back:hover{color:var(--ink)}
.wrap{max-width:620px;margin:0 auto;padding:32px 20px calc(48px + var(--sab))}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,7vw,46px);line-height:1.05;margin-bottom:4px}
h1 em{font-style:italic;color:var(--coral)}
.sub{color:var(--ink-60);font-size:14px;margin-bottom:28px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.order-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.order-id{font-weight:800}
.status{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-60)}
.order-meta{font-size:13px;color:var(--ink-60);margin:6px 0 10px}
.order-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;background:var(--ink);color:var(--cream);border:none;border-radius:12px;padding:10px 18px;font-size:14px;font-weight:700;transition:background .2s}
.btn:hover{background:var(--coral-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;margin-left:6px}
.badge.paid{background:#DDEEDD;color:#1E5E2E}
.badge.wait{background:#F6E3C8;color:#8A5A00}
/* чат */
.chat{margin-top:34px}
.chat h2{font-family:var(--serif);font-weight:500;font-size:28px;margin-bottom:12px}
.chat-box{background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;height:420px;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg.client{align-self:flex-end;background:var(--ink);color:var(--cream);border-bottom-right-radius:4px}
.msg.manager{align-self:flex-start;background:var(--cream-2);border-bottom-left-radius:4px}
.msg .time{display:block;font-size:10px;opacity:.55;margin-top:4px}
.chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-form input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:inherit;font-size:14px;background:var(--cream);color:var(--ink);outline:none}
.chat-form input:focus{border-color:var(--ink)}
.chat-form button{background:var(--coral);color:#fff;border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px}
.chat-form button:hover{background:var(--coral-deep)}
.empty{color:var(--ink-40);font-size:14px;text-align:center;margin:auto}
.notice{background:#FDF3D8;border:1px solid #E8D9A8;border-radius:12px;padding:12px 14px;font-size:13px;margin-bottom:18px;word-break:break-all}
.error{color:var(--coral-deep);font-size:14px;margin-bottom:14px}
</style>
</head>
<body>
<header class="head">
  <div class="brand">ПИТОМНИК МНОГОЛЕТНИКОВ</div>
  <a class="back" href="/">← Каталог</a>
</header>
<div class="wrap">
  <h1>Мои <em>заказы</em></h1>
  <div class="sub" id="whoami">Загружаем…</div>
  <div class="notice" id="linkNotice" style="display:none"></div>
  <div class="error" id="err" style="display:none"></div>
  <div id="orders"></div>

  <section class="chat" id="chatSection" style="display:none">
    <h2>Чат с менеджером</h2>
    <div class="chat-box">
      <div class="chat-msgs" id="chatMsgs"><div class="empty">Сообщений пока нет — напишите первым</div></div>
      <form class="chat-form" id="chatForm">
        <input id="chatInput" maxlength="2000" placeholder="Ваш вопрос…" autocomplete="off">
        <button type="submit">Отправить</button>
      </form>
    </div>
  </section>
</div>
<script>
var TOKEN = (function(){
  var m = location.pathname.match(/^\/client\/([A-Za-z0-9_\-]+)/);
  if (m) return m[1];
  try { return localStorage.getItem('site_token') || getCookie('site_token') || ''; } catch(e){ return ''; }
})();
function getCookie(n){
  var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)'));
  return m ? decodeURIComponent(m[1]) : null;
}
function saveToken(t){
  try { localStorage.setItem('site_token', t); } catch(e){}
  document.cookie = 'site_token=' + encodeURIComponent(t) + '; path=/; max-age=31536000; SameSite=Lax';
}
var STATUS_RU = {
  new:'Новый', awaiting_prepayment:'Ждём предоплату', payment_confirmed:'Предоплата подтверждена',
  shipped:'Отправлен', done:'Завершён', cancelled:'Отменён'
};
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }

async function api(path, opts){
  var r = await fetch(path, opts);
  if (!r.ok){ var t = await r.text(); throw new Error(t); }
  return r.json();
}

async function loadProfile(){
  if (!TOKEN){
    document.getElementById('whoami').textContent = 'Персональная страница появляется после оформления заказа. Если заказ уже был — откройте ссылку из письма/сообщения менеджера.';
    return;
  }
  saveToken(TOKEN);
  try {
    var p = await api('/api/client/' + TOKEN);
    document.getElementById('whoami').textContent =
      (p.full_name || 'Клиент') + (p.phone ? ' · ' + p.phone : '') + (p.city ? ' · ' + p.city : '');
    var notice = document.getElementById('linkNotice');
    notice.style.display = 'block';
    notice.innerHTML = '🔗 Ваша персональная ссылка (сохраните, чтобы не потерять):<br><b>' + esc(location.origin + '/client/' + TOKEN) + '</b>';
    renderOrders(p.orders || []);
    document.getElementById('chatSection').style.display = 'block';
    startChat();
  } catch(e){
    var err = document.getElementById('err');
    err.style.display = 'block';
    err.textContent = 'Не удалось загрузить данные. Проверьте ссылку.';
    document.getElementById('whoami').textContent = '';
  }
}

function renderOrders(orders){
  var box = document.getElementById('orders');
  if (!orders.length){ box.innerHTML = '<div class="card"><div class="empty">Заказов пока нет</div></div>'; return; }
  box.innerHTML = orders.map(function(o){
    var payBadge = o.remainder_paid ? '<span class="badge paid">Оплачен</span>'
      : o.prepayment_paid ? '<span class="badge wait">Ждём остаток</span>'
      : '<span class="badge wait">Ждём предоплату</span>';
    var payBtn = (o.pay_url && !o.remainder_paid && o.status !== 'cancelled')
      ? '<a class="btn" href="' + esc(o.pay_url) + '">Оплатить</a>' : '';
    return '<div class="card">'
      + '<div class="order-top"><span class="order-id">Заказ №' + o.order_id + '</span>'
      + '<span class="status">' + esc(STATUS_RU[o.status] || o.status) + payBadge + '</span></div>'
      + '<div class="order-meta">' + esc(o.created_at || '') + ' · Итого ' + Math.round(o.total_cost) + ' ₽</div>'
      + '<div class="order-actions">' + payBtn + '</div>'
      + '</div>';
  }).join('');
}

/* --- чат --- */
var lastId = 0, chatTimer = null;
function renderMsgs(list){
  var box = document.getElementById('chatMsgs');
  if (lastId === 0) box.innerHTML = '';
  list.forEach(function(m){
    var d = document.createElement('div');
    d.className = 'msg ' + (m.sender === 'client' ? 'client' : 'manager');
    d.innerHTML = esc(m.text) + '<span class="time">' + (m.sender === 'manager' ? 'Менеджер · ' : '') + esc(m.created_at || '') + '</span>';
    box.appendChild(d);
    lastId = Math.max(lastId, m.id);
  });
  if (list.length) box.scrollTop = box.scrollHeight;
  if (lastId === 0 && !list.length) box.innerHTML = '<div class="empty">Сообщений пока нет — напишите первым</div>';
}
async function poll(){
  try {
    var r = await api('/api/client/' + TOKEN + '/messages?after_id=' + lastId);
    renderMsgs(r.messages || []);
  } catch(e){}
}
function startChat(){
  poll();
  chatTimer = setInterval(poll, 5000);
  document.getElementById('chatForm').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var inp = document.getElementById('chatInput');
    var text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    try {
      var r = await api('/api/client/' + TOKEN + '/messages', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text: text})
      });
      renderMsgs([r.message]);
    } catch(e){
      inp.value = text;
      alert('Не удалось отправить сообщение');
    }
  });
}
loadProfile();
</script>
</body>
</html>
