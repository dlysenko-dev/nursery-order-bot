<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3EEE1">
<title>Админка — Питомник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3EEE1;
  --cream-2:#EBE4D1;
  --ink:#0B3B17;
  --ink-60:rgba(11,59,23,.6);
  --ink-40:rgba(11,59,23,.4);
  --coral:#E14B63;
  --coral-deep:#BC2F47;
  --line:rgba(11,59,23,.16);
  --serif:'Cormorant',Georgia,serif;
  --sans:'Manrope',-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:var(--sans);background:var(--cream);color:var(--ink);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;font-size:14px;color:var(--ink)}

/* ============ HEADER ============ */
.head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(14px + var(--sat)) 20px 14px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:15px}
.brand svg{width:26px;height:26px;flex:none}
.head-title{
  font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-40);
}
.btn-out{
  font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:10px 18px;border:1px solid var(--ink-40);border-radius:100px;
  transition:background .3s,color .3s,border-color .3s;
}
.btn-out:hover{background:var(--coral);border-color:var(--coral);color:var(--cream)}

.wrap{max-width:1080px;margin:0 auto;padding:36px 20px calc(56px + var(--sab))}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,7vw,52px);line-height:1.05;letter-spacing:-.01em;margin-bottom:6px}
h1 em{font-style:italic;color:var(--coral)}
.sub{color:var(--ink-60);font-size:14px;margin-bottom:8px}

.sec-title{
  font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-40);margin:40px 0 14px;
}

/* ============ STATS ============ */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{
  border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center;
  background:var(--cream-2);
}
.stat b{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(22px,4vw,32px);font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40)}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ============ TABLE ============ */
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--cream-2)}
table{width:100%;border-collapse:collapse;min-width:960px}
th{
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);
  text-align:left;padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
td .muted{color:var(--ink-40)}
.badge{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;border:1px solid var(--line);
}
.badge--ok{color:var(--ink);border-color:var(--ink-40)}
.badge--off{color:var(--coral-deep);border-color:var(--coral)}
.badge--role{background:var(--ink);color:var(--cream);border-color:var(--ink)}

.actions{display:flex;flex-wrap:wrap;gap:6px}
.act{
  font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;border:1px solid var(--ink-40);border-radius:100px;white-space:nowrap;
  transition:background .3s,color .3s,border-color .3s;
}
.act:hover{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.act--danger:hover{background:var(--coral);border-color:var(--coral);color:var(--cream)}

/* ============ FORMS ============ */
.form{
  border:1px solid var(--line);border-radius:16px;background:var(--cream-2);
  padding:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;
}
.form .full{grid-column:1 / -1}
@media(max-width:640px){.form{grid-template-columns:1fr}}
label{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:6px}
input,select{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--cream);outline:none;transition:border-color .3s;
}
input:focus,select:focus{border-color:var(--ink)}
.field-err{font-size:12px;color:var(--coral-deep);margin-top:4px;min-height:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:14px 28px;border-radius:100px;background:var(--ink);color:var(--cream);
  transition:background .3s;align-self:end;
}
.btn:hover{background:var(--coral)}
.btn:disabled{opacity:.5;cursor:default}

/* ============ LOGIN ============ */
.login{
  max-width:380px;margin:60px auto 0;border:1px solid var(--line);border-radius:20px;
  background:var(--cream-2);padding:30px 26px;
}
.login h2{font-family:var(--serif);font-weight:500;font-size:30px;margin-bottom:4px}
.login .sub{margin-bottom:20px}
.login .field{margin-bottom:12px}
.login .btn{width:100%;margin-top:6px}
.login-err{font-size:13px;color:var(--coral-deep);margin-top:10px;min-height:18px;text-align:center}

/* ============ MODAL ============ */
.modal{
  position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(11,59,23,.45);padding:20px;
}
.modal[hidden]{display:none}
.modal__card{
  background:var(--cream);border-radius:20px;padding:28px 24px;max-width:460px;width:100%;
  box-shadow:0 24px 60px rgba(11,59,23,.3);
}
.modal__title{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:8px}
.modal__text{font-size:14px;color:var(--ink-60);margin-bottom:14px}
.modal__value{
  font-family:var(--sans);font-weight:700;font-size:14px;word-break:break-all;
  background:var(--cream-2);border:1px solid var(--line);border-radius:12px;
  padding:14px;margin-bottom:18px;
}
.modal__btns{display:flex;gap:10px;flex-wrap:wrap}
.modal__btns .btn{flex:1;padding:12px 18px}
.btn--ghost{background:transparent;color:var(--ink);border:1px solid var(--ink-40)}
.btn--ghost:hover{background:var(--ink);color:var(--cream)}

/* ============ TOAST ============ */
#toast{
  position:fixed;left:50%;bottom:calc(28px + var(--sab));z-index:70;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--cream);font-size:13px;font-weight:600;
  padding:12px 22px;border-radius:100px;max-width:90vw;text-align:center;
  transition:transform .4s var(--ease),opacity .4s;
}
#toast.is-show{transform:translate(-50%,0);opacity:1}

.empty{padding:34px 16px;text-align:center;color:var(--ink-40);font-size:14px}
</style>
</head>
<body>

<header class="head">
  <a class="brand" href="/">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 44C24 44 8 34 8 20C8 11 15 4 24 4C33 4 40 11 40 20C40 34 24 44 24 44Z" stroke="currentColor" stroke-width="2.4"/>
      <path d="M24 44V14M24 22C24 22 19 20 17 15M24 28C24 28 30 26 32 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    Питомник
  </a>
  <span class="head-title">Админка</span>
  <button class="btn-out" id="btnLogout" hidden>Выйти</button>
</header>

<main class="wrap">

  <!-- ======= LOGIN ======= -->
  <section id="viewLogin" hidden>
    <form class="login" id="loginForm" novalidate>
      <h2>Вход для админа</h2>
      <p class="sub">Введите логин и пароль администратора.</p>
      <div class="field">
        <label for="loginUser">Логин</label>
        <input id="loginUser" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPass">Пароль</label>
        <input id="loginPass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="loginBtn">Войти</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </section>

  <!-- ======= ADMIN ======= -->
  <section id="viewAdmin" hidden>
    <h1>Админка <em>питомника</em></h1>
    <p class="sub" id="helloLine"></p>

    <div class="sec-title">Общая статистика</div>
    <div class="stats" id="statsCards">
      <div class="stat"><b id="stTotal">—</b><span>сотрудников</span></div>
      <div class="stat"><b id="stActive">—</b><span>активных</span></div>
      <div class="stat"><b id="stClients">—</b><span>клиентов</span></div>
      <div class="stat"><b id="stOrders">—</b><span>заказов</span></div>
      <div class="stat"><b id="stSum">—</b><span>общая сумма</span></div>
    </div>

    <div class="sec-title">Сотрудники</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>Имя</th><th>Логин</th><th>Telegram @username</th><th>Telegram ID</th><th>Роль</th><th>Статус</th>
            <th>Последний вход</th><th>Создан</th><th>Действия</th>
          </tr>
        </thead>
        <tbody id="empBody">
          <tr><td colspan="8" class="empty">Загрузка…</td></tr>
        </tbody>
      </table>
    </div>

    <div class="sec-title">Добавить сотрудника</div>
    <form class="form" id="createForm" novalidate>
      <div>
        <label for="fName">Имя *</label>
        <input id="fName" type="text" required>
        <div class="field-err" data-err="fName"></div>
      </div>
      <div>
        <label for="fUser">Логин * (мин. 3 символа)</label>
        <input id="fUser" type="text" autocomplete="off" required>
        <div class="field-err" data-err="fUser"></div>
      </div>
      <div>
        <label for="fPass">Пароль * (мин. 6 символов)</label>
        <input id="fPass" type="text" autocomplete="off" required>
        <div class="field-err" data-err="fPass"></div>
      </div>
      <div>
        <label for="fTg">Telegram ID (необязательно)</label>
        <input id="fTg" type="text" inputmode="numeric" autocomplete="off">
        <div class="field-err" data-err="fTg"></div>
      </div>
      <div>
        <label for="fTgUsername">Telegram @username (необязательно)</label>
        <input id="fTgUsername" type="text" autocomplete="off" placeholder="username без @">
        <div class="field-err" data-err="fTgUsername"></div>
      </div>
      <div>
        <label for="fRole">Роль</label>
        <select id="fRole">
          <option value="manager">Менеджер</option>
          <option value="admin">Админ</option>
        </select>
      </div>
      <button class="btn" type="submit" id="createBtn">Создать</button>
    </form>
  </section>
</main>

<!-- ======= MODAL ======= -->
<div class="modal" id="modal" hidden>
  <div class="modal__card">
    <div class="modal__title" id="modalTitle"></div>
    <div class="modal__text" id="modalText"></div>
    <div class="modal__value" id="modalValue"></div>
    <div class="modal__btns">
      <button class="btn" id="modalCopy">Копировать</button>
      <button class="btn btn--ghost" id="modalClose">Закрыть</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(function(){
"use strict";

var TOKEN_KEY = 'nursery_admin_token';
var token = localStorage.getItem(TOKEN_KEY) || '';
var employees = [];

var $ = function(id){ return document.getElementById(id); };
var toastEl = $('toast'), toastTimer = null;

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('is-show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('is-show'); }, 2400);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmt(n){ return Number(n || 0).toLocaleString('ru-RU') + ' ₽'; }

/* ---------- API ---------- */
function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers);
  if (opts.body && typeof opts.body !== 'string') {
    opts.body = JSON.stringify(opts.body);
    opts.headers['Content-Type'] = 'application/json';
  }
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, opts).then(function(r){
    if (r.status === 401) {
      showLogin();
      throw new Error('unauthorized');
    }
    return r.json().then(function(data){
      if (!r.ok) throw new Error(data.detail || ('Ошибка ' + r.status));
      return data;
    });
  });
}

/* ---------- Views ---------- */
function showLogin(msg){
  $('viewAdmin').hidden = true;
  $('viewLogin').hidden = false;
  $('btnLogout').hidden = true;
  if (msg) $('loginErr').textContent = msg;
}
function showAdmin(me){
  $('viewLogin').hidden = true;
  $('viewAdmin').hidden = false;
  $('btnLogout').hidden = false;
  $('helloLine').textContent = 'Вы вошли как ' + me.name + ' (' + me.username + ')';
  loadStats();
  loadEmployees();
}

/* ---------- Auth ---------- */
$('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  var u = $('loginUser').value.trim(), p = $('loginPass').value;
  $('loginErr').textContent = '';
  if (!u || !p) { $('loginErr').textContent = 'Введите логин и пароль'; return; }
  $('loginBtn').disabled = true;
  fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: u, password: p})
  }).then(function(r){
    return r.json().then(function(data){
      if (!r.ok) throw new Error(data.detail || 'Ошибка входа');
      return data;
    });
  }).then(function(data){
    if (data.role !== 'admin') {
      throw new Error('Доступ только для администратора');
    }
    token = data.token;
    localStorage.setItem(TOKEN_KEY, token);
    return api('/api/auth/me').then(showAdmin);
  }).catch(function(err){
    if (err.message !== 'unauthorized') $('loginErr').textContent = err.message;
  }).finally(function(){
    $('loginBtn').disabled = false;
  });
});

$('btnLogout').addEventListener('click', function(){
  fetch('/api/auth/logout?session_token=' + encodeURIComponent(token), {method: 'POST'})
    .catch(function(){}).finally(function(){
      token = '';
      localStorage.removeItem(TOKEN_KEY);
      showLogin();
    });
});

/* ---------- Stats ---------- */
function loadStats(){
  api('/api/admin/stats').then(function(data){
    var list = data.employees || [];
    var clients = 0, orders = 0, sum = 0, active = 0;
    list.forEach(function(s){
      clients += s.clients || 0;
      orders += s.orders || 0;
      sum += s.sum || 0;
      if (s.is_active) active++;
    });
    $('stTotal').textContent = list.length;
    $('stActive').textContent = active;
    $('stClients').textContent = clients;
    $('stOrders').textContent = orders;
    $('stSum').textContent = fmt(sum);
  }).catch(function(err){
    if (err.message !== 'unauthorized') toast('Не удалось загрузить статистику');
  });
}

/* ---------- Employees ---------- */
function loadEmployees(){
  api('/api/admin/employees').then(function(data){
    employees = data.employees || [];
    renderEmployees();
  }).catch(function(err){
    if (err.message !== 'unauthorized') toast('Не удалось загрузить сотрудников');
  });
}

function renderEmployees(){
  var body = $('empBody');
  if (!employees.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty">Сотрудников пока нет</td></tr>';
    return;
  }
  body.innerHTML = employees.map(function(e){
    var roleBadge = e.role === 'admin'
      ? '<span class="badge badge--role">Админ</span>'
      : '<span class="badge">Менеджер</span>';
    var statusBadge = e.is_active
      ? '<span class="badge badge--ok">Активен</span>'
      : '<span class="badge badge--off">Заблокирован</span>';
    var toggleLabel = e.is_active ? 'Блокировать' : 'Разблокировать';
    var roleLabel = e.role === 'admin' ? 'Сделать менеджером' : 'Сделать админом';
    return '<tr>' +
      '<td><b>' + esc(e.name) + '</b></td>' +
      '<td>' + esc(e.username || '—') + '</td>' +
      '<td>' + (e.telegram_username ? '<span class="muted">@</span>' + esc(e.telegram_username) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (e.telegram_id != null ? esc(e.telegram_id) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + roleBadge + '</td>' +
      '<td>' + statusBadge + '</td>' +
      '<td>' + (e.last_login_at ? esc(e.last_login_at) : '<span class="muted">—</span>') + '</td>' +
      '<td>' + (e.created_at ? esc(e.created_at) : '<span class="muted">—</span>') + '</td>' +
      '<td><div class="actions">' +
        '<button class="act' + (e.is_active ? ' act--danger' : '') + '" data-action="toggle" data-id="' + e.id + '">' + toggleLabel + '</button>' +
        '<button class="act" data-action="tgusername" data-id="' + e.id + '">Telegram @</button>' +
        '<button class="act" data-action="reset" data-id="' + e.id + '">Сбросить пароль</button>' +
        '<button class="act" data-action="secret" data-id="' + e.id + '">Новая ссылка</button>' +
        '<button class="act" data-action="role" data-id="' + e.id + '">' + roleLabel + '</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function findEmp(id){
  for (var i = 0; i < employees.length; i++) if (employees[i].id === id) return employees[i];
  return null;
}

document.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var id = Number(btn.getAttribute('data-id'));
  var emp = findEmp(id);
  if (!emp) return;
  var action = btn.getAttribute('data-action');

  if (action === 'toggle') {
    var verb = emp.is_active ? 'Заблокировать' : 'Разблокировать';
    if (!confirm(verb + ' сотрудника «' + emp.name + '»?')) return;
    api('/api/admin/employees/' + id, {method: 'PATCH', body: {is_active: !emp.is_active}})
      .then(function(){ toast(emp.is_active ? 'Сотрудник заблокирован' : 'Сотрудник разблокирован'); loadEmployees(); loadStats(); })
      .catch(showErr);
  }
  if (action === 'reset') {
    if (!confirm('Сбросить пароль сотрудника «' + emp.name + '»?')) return;
    api('/api/admin/employees/' + id + '/reset-password', {method: 'POST'})
      .then(function(data){
        showModal('Новый пароль', 'Передайте сотруднику «' + emp.name + '» новый пароль. Он показывается один раз.', data.new_password);
      })
      .catch(showErr);
  }
  if (action === 'secret') {
    if (!confirm('Сгенерировать новую секретную ссылку для «' + emp.name + '»? Старая перестанет работать.')) return;
    api('/api/admin/employees/' + id + '/regenerate-secret', {method: 'POST'})
      .then(function(data){
        showModal('Секретная ссылка', 'Новая ссылка для входа сотрудника «' + emp.name + '».', secretUrl(data.secret_token));
      })
      .catch(showErr);
  }
  if (action === 'role') {
    var newRole = emp.role === 'admin' ? 'manager' : 'admin';
    var label = newRole === 'admin' ? 'админом' : 'менеджером';
    if (!confirm('Сделать «' + emp.name + '» ' + label + '?')) return;
    api('/api/admin/employees/' + id, {method: 'PATCH', body: {role: newRole}})
      .then(function(){ toast('Роль обновлена'); loadEmployees(); })
      .catch(showErr);
  }
  if (action === 'tgusername') {
    var current = emp.telegram_username ? '@' + emp.telegram_username : '';
    var value = window.prompt('Telegram @username для «' + emp.name + '» (оставьте пустым чтобы удалить):', current);
    if (value === null) return;
    value = value.replace(/^@/, '').trim();
    api('/api/admin/employees/' + id, {method: 'PATCH', body: {telegram_username: value || null}})
      .then(function(){ toast('Telegram username обновлён'); loadEmployees(); })
      .catch(showErr);
  }
});

function showErr(err){
  if (err.message !== 'unauthorized') toast(err.message || 'Ошибка запроса');
}

function secretUrl(secret){
  return location.origin + '/api/auth/secret/' + secret;
}

/* ---------- Create employee ---------- */
function setErr(field, msg){
  var el = document.querySelector('[data-err="' + field + '"]');
  if (el) el.textContent = msg || '';
}

$('createForm').addEventListener('submit', function(e){
  e.preventDefault();
  ['fName','fUser','fPass','fTg','fTgUsername'].forEach(function(f){ setErr(f, ''); });

  var name = $('fName').value.trim();
  var username = $('fUser').value.trim();
  var password = $('fPass').value;
  var tgRaw = $('fTg').value.trim();
  var tgUsernameRaw = $('fTgUsername').value.trim();
  var role = $('fRole').value;

  var ok = true;
  if (!name) { setErr('fName', 'Укажите имя'); ok = false; }
  if (username.length < 3) { setErr('fUser', 'Минимум 3 символа'); ok = false; }
  if (password.length < 6) { setErr('fPass', 'Минимум 6 символов'); ok = false; }
  var telegram_id = null;
  if (tgRaw) {
    if (!/^\d+$/.test(tgRaw)) { setErr('fTg', 'Только цифры'); ok = false; }
    else telegram_id = Number(tgRaw);
  }
  var telegram_username = tgUsernameRaw ? tgUsernameRaw.replace(/^@/, '') : null;
  if (telegram_username && telegram_username.length < 3) { setErr('fTgUsername', 'Минимум 3 символа'); ok = false; }
  if (!ok) return;

  $('createBtn').disabled = true;
  api('/api/admin/employees', {
    method: 'POST',
    body: {name: name, username: username, password: password, telegram_id: telegram_id, telegram_username: telegram_username, role: role}
  }).then(function(data){
    var emp = data.employee;
    showModal(
      'Сотрудник создан',
      '«' + emp.name + '» (' + emp.username + '), роль: ' + (emp.role === 'admin' ? 'админ' : 'менеджер') + '. Секретная ссылка для входа:',
      secretUrl(data.secret_token)
    );
    $('createForm').reset();
    loadEmployees();
    loadStats();
  }).catch(function(err){
    if (err.message !== 'unauthorized') setErr('fUser', err.message);
  }).finally(function(){
    $('createBtn').disabled = false;
  });
});

/* ---------- Modal ---------- */
function showModal(title, text, value){
  $('modalTitle').textContent = title;
  $('modalText').textContent = text;
  $('modalValue').textContent = value;
  $('modalCopy').setAttribute('data-value', value);
  $('modal').hidden = false;
}
$('modalClose').addEventListener('click', function(){ $('modal').hidden = true; });
$('modal').addEventListener('click', function(e){
  if (e.target === $('modal')) $('modal').hidden = true;
});
$('modalCopy').addEventListener('click', function(){
  copyText(this.getAttribute('data-value'));
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') $('modal').hidden = true;
});

/* ---------- Copy ---------- */
function copyText(text){
  function done(){ toast('Скопировано'); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function(){ legacy(); done(); });
  } else { legacy(); done(); }
  function legacy(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta);
  }
}

/* ---------- Init ---------- */
if (token) {
  api('/api/auth/me').then(function(me){
    if (me.role !== 'admin') {
      localStorage.removeItem(TOKEN_KEY);
      token = '';
      showLogin('Доступ только для администратора');
      return;
    }
    showAdmin(me);
  }).catch(function(err){
    if (err.message !== 'unauthorized') showLogin();
  });
} else {
  showLogin();
}
})();
</script>
